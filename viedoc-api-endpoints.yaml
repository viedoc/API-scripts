
note: 
  source_of_truth: 
    viedoc_admin: "Use the exact URLs shown when the API client is created in Viedoc Admin."
    help_urls:
      - "https://help.viedoc.net/l/debc54"
  usage:
    clinic: "Browser URL used to access the Viedoc application UI."
    web_api: "Base URL for the Viedoc Web API used by export and site/user scripts."
    sts: "Base URL for the OAuth security token service host. Token retrieved from {base}/connect/token endpoint."
    swagger: "Swagger UI for exploring the Viedoc Web API." 
    wcf_wsdl: "WSDL URL for the WCF API used with the Data Import Application."
  pattern: 
    web_api: "https://{prefix}api{env_qualifier}{region}.viedoc.{tld}"
    sts:     "https://{prefix}sts{env_qualifier}{region}.viedoc.{tld}"
    swagger: "https://{prefix}api{env_qualifier}{region}.viedoc.{tld}/swagger/index.html"
    wcf_wsdl: "https://{prefix}api{env_qualifier}{region}.viedoc.{tld}/HelipadService.svc?wsdl"

